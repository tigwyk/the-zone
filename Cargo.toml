[package]
name = "the-zone"
version = "0.1.0"
edition = "2024"

[dependencies]
# Default Bevy is the whole engine: the 3d stack (pbr/gltf/light/mesh), ui, scene,
# animation, picking, gizmos, post-process, plus png/hdr image codecs and the vorbis
# audio decoder. This is a 2D text game, so we name only what it uses: window + winit,
# the 2D text/sprite renderer, wav audio, states, and the asset core.
bevy = { version = "=0.19.1", default-features = false, features = [
    "async_executor",
    "bevy_asset",
    "bevy_audio",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "reflect_auto_register",
    "std",
    "wav",
] }
bevy-term = { path = "../bevy-term", features = ["window"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Bevy is ~340 crates of generic code, and a debug build keeps debuginfo for every
# monomorphized instantiation of it: 5GB of rlibs and 4GB of stale .pdb files that
# cargo never collects. Nobody steps into the engine, so the deps do without symbols.
# Our own crate is untouched and still debuggable.
[profile.dev.package."*"]
debug = false
