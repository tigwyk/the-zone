[package]
name = "the-zone"
version = "0.1.0"
edition = "2024"

[dependencies]
# "wav" so the cues in assets/audio decode; Bevy ships vorbis only by default.
bevy = { version = "=0.19.1", features = ["wav"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Bevy is ~340 crates of generic code, and a debug build keeps debuginfo for every
# monomorphized instantiation of it: 5GB of rlibs and 4GB of stale .pdb files that
# cargo never collects. Nobody steps into bevy_pbr, so the deps do without symbols.
# Our own crate is untouched and still debuggable.
[profile.dev.package."*"]
debug = false
